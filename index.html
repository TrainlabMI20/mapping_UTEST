<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Système Train</title><style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            margin: 0;
        }
        .sidebar {
            width: 200px;
            background-color: #333;
            color: white;
            padding: 15px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.5);
        }
        .sidebar button {
            background-color: #555;
            color: white;
            border: none;
            padding: 10px;
            margin: 10px 0;
            width: 100%;
            cursor: pointer;
            border-radius: 25px; /* Arrondir les coins du bouton */
            transition: background-color 0.3s; /* Animation de transition pour le hover */
        }
        .sidebar button:hover {
            background-color: #777;
        }
        .content {
            flex-grow: 1;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .train-view {
            text-align: center;
            border: 1px solid #ccc;
            padding: 20px;
            background-color: #fff;
            margin-top: 20px;
        }
        .led {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin: 5px;
        }
        .led.on {
            background-color: green;
        }
        .led.off {
            background-color: red;
        }
    </style></head><body><div class="sidebar"><h2>Système Train</h2><button onclick="showView('view_train')">Vue Globale</button><button onclick="showView('view_doors')">Portes</button><button onclick="showView('view_pantograph')">Pantographe</button><button onclick="showView('view_compressor')">Compresseur</button><button onclick="showView('view_mos')">MIOS</button></div><div class="content"><div id="train-view" class="train-view"><h3>Vue Globale du Train</h3><p>Représentation du train de côté avec portes, pantographe, compresseur.</p><img src="https://via.placeholder.com/300x100?text=Train+Vue" alt="Train" /><div id="leds" style="display: none;"><h4>État des LEDs du MOS</h4><div class="led on"></div><div class="led off"></div><div class="led on"></div><div class="led off"></div><div class="led on"></div></div></div></div><script>
        function showView(view) {
            const trainView = document.getElementById('train-view');
            const leds = document.getElementById('leds');
            switch(view) {
                case 'view_train':
                    trainView.innerHTML = `<h3>Vue Globale du Train</h3><p>Représentation du train de côté avec portes, pantographe, compresseur.</p><img src="https://via.placeholder.com/300x100?text=Train+Vue" alt="Train" />`;
                    leds.style.display = 'none';
                    break;
                case 'view_doors':
                    trainView.innerHTML = `<h3>Portes</h3><p>État des portes du train.</p>`;
                    leds.style.display = 'none';
                    break;
                case 'view_pantograph':
                    trainView.innerHTML = `<h3>Pantographe</h3><p>État du pantographe du train.</p>`;
                    leds.style.display = 'none';
                    break;
                case 'view_compressor':
                    trainView.innerHTML = `<h3>Compresseur</h3><p>État du compresseur du train.</p>`;
                    leds.style.display = 'none';
                    break;
                case 'view_mos':
                    trainView.innerHTML = `<h3>MIOS</h3><p>État des LEDs du MOS.</p>`;
                    leds.style.display = 'block';
                    break;
            }
        }
    </script></body></html>
